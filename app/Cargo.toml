[package]
name = "learn_pali"
description = "learn-pali: learning Pāli, Leptos SSR + hydrate on palicanon-ui-lib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Built from ../ui-lib (the workspace's [patch]); the branch must hold the
# standalone manifest, Cargo reads it even when patched; the version is a real
# constraint, so cargo-deny's wildcard rule holds.
palicanon-ui-lib = { version = "0.1", git = "ssh://git@github.com/PaliCanon/ui-lib.git", branch = "main" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like
# ui-lib's): read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# The learning loop (task 002): deck, state, session; the JSON is its own.
learn_core = { version = "0.0.0", path = "../core" }
# The browser glue (store, today, export/import), hydrate only.
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Document",
  "Storage",
  "StorageEvent",
  "VisibilityState",
  "HtmlInputElement",
  "HtmlAnchorElement",
  "FileList",
  "File",
  "FileReader",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "Event",
  "EventTarget",
  "Element",
  "KeyboardEvent",
] }
js-sys = { version = "0.3", optional = true }

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (ui-lib's build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# Drives the document test: the head the meta context collected is injected
# into the rendered stream as `leptos_axum` does (already in the lock).
futures = "0.3"
# The injection awaits a tick of the global executor: tokio, as the server runs.
any_spawner = { version = "0.3", features = ["tokio"] }

[features]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  "dep:web-sys",
  "dep:js-sys",
]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
