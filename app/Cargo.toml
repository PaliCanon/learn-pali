[package]
name = "learn_pali"
description = "learn-pali: learning Pāli, Leptos SSR + hydrate on palicanon-ui-lib."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned by tag (docs conventions/ui-lib.md): taking a new ui-lib is a bump of
# this tag. Built from ../ui-lib (the workspace's [patch]); CI and deploy check
# ../ui-lib out at this same tag (.github/actions/ui-lib) and fail when its
# version differs. The version is a real constraint, so cargo-deny's wildcard
# rule holds.
palicanon-ui-lib = { version = "0.3", git = "ssh://git@github.com/PaliCanon/ui-lib.git", tag = "v0.3.1" }
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
# This service's own strings, a typed catalogue generated by build.rs (like
# ui-lib's): read in ui-lib's `language_signal`, not leptos_i18n's.
leptos_i18n = { version = "0.6.2", default-features = false }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
# The origin guard compares the Worker's secret in constant time (`origin.rs`).
subtle = { version = "2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# The learning loop (task 002): deck, state, session; the JSON is its own.
learn_core = { version = "0.1.0", path = "../core" }
# The browser glue (clock, DOM, reload), for both client modes. The features
# only the web store needs are enabled by its feature (`web-store` below), so
# the app's build does not bind them.
web-sys = { version = "0.3", optional = true, features = [
  "Window",
  "Document",
  "VisibilityState",
  "Event",
  "EventTarget",
  "Element",
  "KeyboardEvent",
  "Location",
] }
js-sys = { version = "0.3", optional = true }
# The web sync's Drive calls (`fetch`) are awaited (task 050); already in the
# lock through leptos.
wasm-bindgen-futures = { version = "0.4", optional = true }
# The web sync reads Google's JSON answers (task 050), in pure functions the
# native tests cover; already in the lock through learn_core.
serde_json = "1"

[build-dependencies]
# As in ui-lib's build.rs: the parser's diagnostics fail the build on a missing key.
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (ui-lib's build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
serde_json = "1"
# Drives the document test: the head the meta context collected is injected
# into the rendered stream as `leptos_axum` does (already in the lock).
futures = "0.3"
# The injection awaits a tick of the global executor: tokio, as the server runs.
any_spawner = { version = "0.3", features = ["tokio"] }
# Drives the real router with `oneshot` (`tests/origin.rs`); already in the lock through axum.
tower = { version = "0.5", features = ["util"] }

# The browser test of the fragment in csr mode (tests/csr.rs, task 048), run
# by wasm-bindgen-test-runner in a headless Chrome; the extra web-sys feature
# lets it move the page to /learn.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["History"] }

[features]
# The browser glue (the DOM, the clock, the random seed), shared by both
# client modes: `hydrate` (the site) and `csr` (the PaliCanon app).
browser = [
  "dep:wasm-bindgen",
  "dep:web-sys",
  "dep:js-sys",
]
# The localStorage progress store and the Blob / file input transfer the
# site uses (`web_store()`, `web_files()`). The app builds with `csr` alone,
# so none of it is compiled there: it has its own store.
web-store = [
  "browser",
  "web-sys/Storage",
  "web-sys/StorageEvent",
  "web-sys/HtmlInputElement",
  "web-sys/HtmlAnchorElement",
  "web-sys/HtmlElement",
  "web-sys/Node",
  "web-sys/FileList",
  "web-sys/File",
  "web-sys/FileReader",
  "web-sys/Blob",
  "web-sys/BlobPropertyBag",
  "web-sys/Url",
]
# The site's sync through the learner's Google Drive (task 050,
# `web_sync()`): Google Identity Services' token client, loaded on the first
# Sign in or Sync tap, and the Drive REST calls from the browser. The app
# builds with `csr` alone and syncs through its own Rust transport.
web-sync = [
  "web-store",
  "dep:wasm-bindgen-futures",
  "web-sys/Headers",
  "web-sys/Request",
  "web-sys/RequestInit",
  "web-sys/Response",
  "web-sys/HtmlHeadElement",
  "web-sys/HtmlScriptElement",
  "web-sys/console",
]
hydrate = [
  "leptos/hydrate",
  "palicanon-ui-lib/hydrate",
  "browser",
  "web-store",
  "web-sync",
  "dep:console_error_panic_hook",
]
# The PaliCanon app: the Learn fragment mounted by a host with no server
# (ui-lib `csr::mount`), without the web store.
csr = ["leptos/csr", "palicanon-ui-lib/csr", "browser"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:subtle",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "palicanon-ui-lib/ssr",
]

[lints]
workspace = true
