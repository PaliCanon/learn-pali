# From Lsh0x/rankfusion's ci.yml and ui-lib's, adapted to a Leptos service:
# every check runs for the server (`ssr`, native) and, for clippy, the
# browser (`hydrate`, wasm32), the two builds the site makes, and `csr` alone
# (wasm32, no `web-store`), the build the PaliCanon app takes the Learn
# fragment in. No `--all-features`, no `--workspace`: `ssr`, `hydrate` and
# `csr` do not build together. The three other crates (`learn_core`, `learn_cli`, `build_deck`)
# have no feature and are named with `-p`; `learn_core` also builds for
# wasm32 (the site will run it), hence its own clippy entry. `build_deck`
# compiles a bundled SQLite (C): the runner's `cc` is enough.
#
# Two checkouts, in every job that runs cargo: this repository goes into
# `learn-pali/` and `PaliCanon/ui-lib` beside it in `ui-lib/`, because the
# workspace `[patch]`, `app/style/main.css` (`@import` of
# `../../../ui-lib/style/theme.css`) and `app/build.rs` (`#[path]` to
# `../../ui-lib/build/placeholders.rs`) all reach `../ui-lib`. ui-lib is
# checked out at the tag app/Cargo.toml pins, through the composite action,
# guarded to match its version. The credential is the GitHub App `palicanon-ci`
# (Contents: read): the action mints a one-hour token for ui-lib only from the
# repository secrets APP_ID and APP_PRIVATE_KEY and checks out with it. No ssh
# key, no ssh agent: Cargo.lock holds no git source, cargo fetches nothing
# private.
# Cargo steps run in `learn-pali/` (`defaults.run`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: learn-pali

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - feature: ssr
            args: -p learn_pali --features ssr --all-targets
          - feature: hydrate
            args: -p learn_pali --features hydrate --lib --target wasm32-unknown-unknown
          # The app's feature set: the fragment with no web store (048).
          - feature: csr
            args: -p learn_pali --features csr --all-targets --target wasm32-unknown-unknown
          - feature: native
            args: -p learn_core -p learn_cli -p build_deck --all-targets
          - feature: core-wasm
            args: -p learn_core --lib --target wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p learn_pali --features ssr
      - run: cargo test --locked -p learn_core -p learn_cli -p build_deck

  # tests/csr.rs (task 048): the Learn fragment in the app's mode, mounted by
  # ui-lib's `csr::mount`, in a real browser. wasm-bindgen-test-runner drives a
  # headless Chrome through chromedriver; ubuntu-latest ships Google Chrome and
  # its matching chromedriver ($CHROMEWEBDRIVER). The runner must be the
  # wasm-bindgen of Cargo.lock. Also builds `csr` alone, the app's feature set,
  # and fails when the web store's `localStorage` glue is in it.
  test-browser:
    name: test (csr, headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every run step names its directory: the repository is checked out
      # into `learn-pali/` (the workflow's `defaults.run` says so too), and a
      # job that ran at the workspace root would find no Cargo.lock.
      - id: wasm-bindgen
        working-directory: learn-pali
        run: echo "version=$(cargo pkgid --locked wasm-bindgen | sed 's/.*@//')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - working-directory: learn-pali
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --locked -p learn_pali --features csr --target wasm32-unknown-unknown --test csr
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - working-directory: learn-pali
        run: bash scripts/csr-without-web-store.sh

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --locked --no-deps -p learn_pali --features ssr -p learn_core -p learn_cli -p build_deck

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@1.88
      # --locked: the committed Cargo.lock is what the MSRV claim is verified
      # against; a fresh resolution could pull a dependency with a higher MSRV.
      - run: cargo check --locked -p learn_pali --features ssr
      - run: cargo check --locked -p learn_core -p learn_cli -p build_deck

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      # No ssh: the lock holds no git source, cargo-deny fetches nothing private.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: learn-pali/Cargo.toml
          command: check advisories bans sources licenses

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p learn_pali -p learn_core -p learn_cli -p build_deck --features learn_pali/ssr --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          working-directory: learn-pali
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The infrastructure and its scripts (034 round 1): nothing else in CI runs
  # them. No ui-lib checkout and no Rust: OpenTofu formats and validates
  # `infra/` (init without the backend: no credential, the providers only),
  # node runs the Worker's tests, bash the two script suites (python3 with
  # PyYAML, curl and jq are on the runner; the first suite also reads
  # deploy.yml and ci.yml). OpenTofu 1.10.0: versions.tf asks 1.8 or later and
  # the cross-variable validation in variables.tf needs 1.9.
  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: learn-pali
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false
      - run: tofu -chdir=infra validate
      - run: node --test infra/worker/proxy.test.mjs
      - run: python3 -c 'import yaml' || sudo apt-get install -y python3-yaml
      - run: bash scripts/rollout-check.test.sh
      - run: bash infra/scripts/origin-secret.test.sh
