name: deploy

# Tag v* → the image, on GHCR. Nothing is deployed from here (task 083): prod
# runs on the user's server (ssh.lsh.tech, repository Lsh0x/lsh-tech, stack
# stacks/palicanon/prod), which pulls the image BY DIGEST. This job writes the
# digest to its summary; the stack is updated from it by hand. A push to main
# runs ci.yml only.
#
# The image is content-addressed: ghcr.io/palicanon/learn-pali:h-<hash>, built
# only when its inputs changed (the tag already on GHCR → no build), plus the
# release tag (v0.1.8) pointing at the same image.
#
# Repository variables (not secrets, no value here):
#   WIF_PROVIDER, DEPLOYER_SA — the workload identity of the `github-deployer`
#   service account, used for one thing: reading the passages asset in
#   gs://palicanon-app-assets (scripts/fetch-passages.sh).
# Repository secrets: APP_ID, APP_PRIVATE_KEY — the GitHub App `palicanon-ci`
#   (Contents: read) that ci.yml already uses; the ui-lib action mints a
#   one-hour token for PaliCanon/ui-lib from them, for the checkout only: the
#   image build takes no credential (app/Dockerfile).
# The push to GHCR uses the job's own GITHUB_TOKEN (packages: write); the image
# label org.opencontainers.image.source links the package to this repository,
# so later pushes keep working.

on:
  push:
    tags: ["v*"]

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/palicanon/learn-pali

# Two checkouts side by side, as in ci.yml: the build reaches `../ui-lib`
# (the workspace's [patch], main.css, build.rs). ui-lib is checked out at
# the tag app/Cargo.toml pins, through the composite action. Commands run
# in learn-pali/; the Docker build context is the folder holding both.
defaults:
  run:
    working-directory: learn-pali

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # persist-credentials: false — the Docker context is the folder holding
      # learn-pali/, so its .git is sent to the build, and a persisted token
      # would sit in .git/config, readable there.
      - uses: actions/checkout@v7
        with:
          path: learn-pali
          persist-credentials: false
      # ui-lib, checked out beside this repository with a GitHub App token.
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # GCP is still needed for one read: the passages asset (070).
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      # The tag is a hash of the tracked inputs' blob ids plus the ui-lib
      # commit built against: the same sources and the same ui-lib always
      # give the same tag, and an existing one is reused. `app` holds
      # everything that shapes the image besides the lock and the manifest:
      # the Dockerfile (and the smoke test written in it) and build.rs, so
      # a fix to either changes the tag. (cli/ and tools/ are not in the
      # image, so they are not in the hash.)
      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          UI_LIB=$(git -C ../ui-lib rev-parse HEAD)
          HASH=$( { git ls-files -s app core Cargo.toml Cargo.lock; echo "ui-lib $UI_LIB"; } | sha256sum | cut -c1-16)
          echo "tag=h-$HASH" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:h-$HASH" >> "$GITHUB_OUTPUT"
          echo "learn-pali: input hash h-$HASH (ui-lib $UI_LIB)"

      - name: Check whether that image already exists
        id: check-image
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${{ steps.vars.outputs.image_hash }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "learn-pali: ${{ steps.vars.outputs.image_hash }} already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the passages asset the image ships (070)
        if: steps.check-image.outputs.exists != 'true'
        run: bash scripts/fetch-passages.sh app/assets.lock assets/passages.db
      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          context: .
          file: learn-pali/app/Dockerfile
          # `working-directory` does not apply to `uses:` steps: the context
          # is the workspace root, the folder holding learn-pali/ and ui-lib/.
          # No `ssh:`, no `secrets:`: the build takes no credential (ui-lib
          # is COPYed and the lock holds no git source).
          push: true
          # No build args: the release (the footer badge's tag or branch, and
          # commit) is not in the image, so its hash does not change with the
          # ref. The stack sets it (the summary prints the values).
          tags: ${{ steps.vars.outputs.image_hash }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The release tag always points at the image of the hash, built now or
      # before; the digest is read back from GHCR, the same way either way.
      - name: Tag the release and write the digest to the summary
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:${{ github.ref_name }}" "$IMAGE_HASH"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE_HASH" --format '{{json .Manifest}}' | jq -r .digest)
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::no digest for $IMAGE_HASH on GHCR (got '$DIGEST')"; exit 1 ;;
          esac
          {
            echo "### learn-pali image"
            echo
            echo "- digest: \`$IMAGE@$DIGEST\`"
            echo "- tags: \`$TAG\`, \`${{ github.ref_name }}\`"
            echo "- release values for the stack: \`$(scripts/release-values.sh)\`"
            echo
            echo "The stack (lsh-tech, stacks/palicanon/prod) pulls the digest: update it by hand."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "learn-pali: $IMAGE@$DIGEST ($TAG, ${{ github.ref_name }})"
