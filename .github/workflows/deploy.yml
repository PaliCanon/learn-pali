name: deploy

# Push to main → dev (learn-pali-dev); tag v* → prod (learn-pali-prod).
# The image is content-addressed: built only when its inputs changed, rolled
# out with no traffic first, checked through the revision's tagged URL with
# the origin header, given the traffic, then checked again: the bare Cloud Run
# URL must refuse a call without the header (else the traffic goes back to the
# revision that served before), and the public host must answer through the
# Worker (an env without Access, which is dev and prod today; an env with
# Access is checked for its login redirect instead; step 6b). The model is
# search-front's deploy.yml; this file only runs once the repository
# variables below are set (README.md, "Deploy"): until then a push to main
# fails at the first step that needs them, touching nothing.
#
# Repository variables (not secrets, no value here):
#   WIF_PROVIDER, DEPLOYER_SA, GCP_PROJECT — the workload identity of the
#   `github-deployer` service account (platform / the site's infra).
# Repository secrets: APP_ID, APP_PRIVATE_KEY — the GitHub App `palicanon-ci`
#   (Contents: read) that ci.yml already uses; the ui-lib action mints a
#   one-hour token for PaliCanon/ui-lib from them, for the checkout only: the
#   image build takes no credential (app/Dockerfile).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  ENV: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'prod' || 'dev' }}
  HOST: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'learn.palicanon.app' || 'learn.dev.palicanon.app' }}
  REGION: europe-west1
  PROJECT: ${{ vars.GCP_PROJECT }}
  # Whether each env's host sits behind Cloudflare Access (step 6b reads the
  # one for $ENV). It mirrors infra/variables.tf `envs.<env>.access` (the
  # defaults, both false today: dev and prod are public behind the origin
  # guard): change both together.
  ACCESS_dev: "false"
  ACCESS_prod: "false"

# Two checkouts side by side, as in ci.yml: the build reaches `../ui-lib`
# (the workspace's [patch], main.css, build.rs). ui-lib is checked out at
# the tag app/Cargo.toml pins, through the composite action. Commands run
# in learn-pali/; the Docker build context is the folder holding both.
defaults:
  run:
    working-directory: learn-pali

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — the Dockerfile copies learn-pali/.git
      # (the footer badge asks git), and a persisted token would sit in
      # .git/config, in a layer that the build cache exports.
      - uses: actions/checkout@v7
        with:
          path: learn-pali
          persist-credentials: false
      # ui-lib, checked out beside this repository with a GitHub App token.
      - uses: ./learn-pali/.github/actions/ui-lib
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # The tag is a hash of the tracked inputs' blob ids plus the ui-lib
      # commit built against: the same sources and the same ui-lib always
      # give the same tag, and an existing one is reused. `app` holds
      # everything that shapes the image besides the lock and the manifest:
      # the Dockerfile (and the smoke test written in it) and build.rs, so
      # a fix to either changes the tag. (cli/ and tools/ are not in the
      # image, so they are not in the hash.)
      - name: Compute the input hash and image refs
        id: vars
        run: |
          set -euo pipefail
          UI_LIB=$(git -C ../ui-lib rev-parse HEAD)
          HASH=$( { git ls-files -s app core Cargo.toml Cargo.lock; echo "ui-lib $UI_LIB"; } | sha256sum | cut -c1-16)
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/palicanon/learn-pali"
          echo "tag=h-$HASH" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "image_hash=$IMAGE:h-$HASH" >> "$GITHUB_OUTPUT"
          echo "learn-pali: input hash h-$HASH (ui-lib $UI_LIB)"

      - name: Check whether that image already exists
        id: check-image
        run: |
          set -euo pipefail
          if gcloud artifacts docker images describe "${{ steps.vars.outputs.image_hash }}" \
            --project "${{ vars.GCP_PROJECT }}" --quiet >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "learn-pali: ${{ steps.vars.outputs.image_hash }} already built, skipped"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check-image.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.check-image.outputs.exists != 'true'
        with:
          context: .
          file: learn-pali/app/Dockerfile
          # `working-directory` does not apply to `uses:` steps: the context
          # is the workspace root, the folder holding learn-pali/ and ui-lib/.
          # No `ssh:`, no `secrets:`: the build takes no credential (ui-lib
          # is COPYed and the lock holds no git source).
          push: true
          # The badge's branch and commit: the image has no .git. A tag
          # build passes the tag name as the branch.
          build-args: |
            LEARN_PALI_GIT_BRANCH=${{ github.ref_name }}
            LEARN_PALI_GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image_hash }}
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 1. What runs is the revision that SERVES the traffic, not the service's
      #    template: after a rollout that built a revision and never moved the
      #    traffic (a failed check, a cancelled job) the template already holds
      #    the new image while the old revision still serves. That revision is
      #    PREV, where a failed public check puts the traffic back; on the
      #    first deploy it is the revision tofu bootstrapped, so a target
      #    always exists. The 100% entry of a service that follows the latest
      #    revision (what tofu creates) names none: then the latest ready one.
      #    No revision at 100% (a split, a hand-made canary) fails, named: a
      #    split is never this pipeline's state, and guessing PREV is worse.
      - name: Is that image already running?
        id: current
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          SERVICE="learn-pali-$ENV"
          DESCRIBED=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json) || DESCRIBED=""
          SERVING=$(printf '%s' "$DESCRIBED" \
            | jq -r '([.status.traffic[]? | select(.percent == 100)] | first) as $e
              | if $e == null then empty
                elif ($e.revisionName // "") != "" then $e.revisionName
                else (.status.latestReadyRevisionName // "") end') || SERVING=""
          if [ -z "$SERVING" ]; then
            SPLIT=$(printf '%s' "$DESCRIBED" \
              | jq -r '[.status.traffic[]? | select((.percent // 0) > 0) | "\(.revisionName // "latest")=\(.percent)%"] | join(", ")') || SPLIT=""
            if [ -n "$SPLIT" ]; then
              echo "::error::traffic is split: $SPLIT; no revision holds 100% of $SERVICE, so the rollback would have nowhere to go (put 100% on one revision by hand)"
            else
              echo "::error::no revision serves $SERVICE: the rollback would have nowhere to go"
            fi
            exit 1
          fi
          CURRENT=$(gcloud run revisions describe "$SERVING" --project "$PROJECT" --region "$REGION" \
            --format='value(spec.containers[0].image)')
          echo "serving=$SERVING" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$IMAGE_HASH" ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "learn-pali: $SERVICE already serves $IMAGE_HASH (revision $SERVING), nothing to deploy"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. A revision under a tag, with no traffic. One that never becomes
      #    ready (the usual cause: the origin secret has no version, so the
      #    container cannot start) fails here with the traffic untouched. Its
      #    name is read right after, checked to be the one that carries the
      #    tag, and handed to step 5: the traffic goes to THAT revision, not
      #    to whatever is newest by then.
      - name: Deploy the revision without traffic
        id: deploy
        if: steps.current.outputs.running != 'true'
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
        run: |
          set -euo pipefail
          SERVICE="learn-pali-$ENV"
          TAG="sha-${GITHUB_SHA::7}"
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION" --image "$IMAGE_HASH" \
            --no-traffic --tag "$TAG" --quiet \
            || { echo "::error::gcloud could not deploy a ready revision of $SERVICE: read its error above (usual causes: the startup probe, or the origin secret has no version: infra/scripts/origin-secret create $ENV); the traffic is untouched"; exit 1; }
          DESCRIBED=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json)
          URL=$(printf '%s' "$DESCRIBED" | jq -r --arg t "$TAG" '[.status.traffic[] | select(.tag == $t) | .url] | .[0] // empty')
          test -n "$URL" || { echo "::error::no URL for the revision tag $TAG on $SERVICE"; exit 1; }
          REVISION=$(printf '%s' "$DESCRIBED" | jq -r '.status.latestCreatedRevisionName // empty')
          TAGGED=$(printf '%s' "$DESCRIBED" | jq -r --arg t "$TAG" '[.status.traffic[] | select(.tag == $t) | .revisionName] | .[0] // empty')
          if [ -z "$REVISION" ] || [ "$REVISION" != "$TAGGED" ]; then
            echo "::error::the newest revision of $SERVICE (${REVISION:-none}) is not the one that carries the tag $TAG (${TAGGED:-none}): another deploy ran meanwhile; the traffic is untouched"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      # 3. The origin secret, in its OWN step: piped from gcloud straight into
      #    a 0600 file holding the curl header line (`rollout-check.sh` hands
      #    it to curl as `-H @file`). It is never a shell variable, an
      #    argument, an output or an env value; the file is read from disk
      #    only and removed at the end of the job. It is masked before any
      #    later step can print it, and no step runs with `set -x`.
      - name: Read the origin secret into a header file
        id: secret
        if: steps.current.outputs.running != 'true'
        run: |
          set -euo pipefail
          umask 077
          HEADER_FILE="$RUNNER_TEMP/origin-header"
          ERR="$RUNNER_TEMP/origin-header.err"
          rm -f "$HEADER_FILE"
          if ! gcloud secrets versions access latest --secret "learn-pali-origin-secret-$ENV" --project "$PROJECT" \
            2> "$ERR" | awk '{ print "x-origin-auth: " $0 }' > "$HEADER_FILE"; then
            rm -f "$HEADER_FILE"
            if grep -q PERMISSION_DENIED "$ERR"; then
              echo "::error::the deployer lacks secretAccessor on learn-pali-origin-secret-$ENV (infra: the role on the secret)"
            else
              echo "::error::could not read learn-pali-origin-secret-$ENV: $(head -c 300 "$ERR")"
            fi
            rm -f "$ERR"
            exit 1
          fi
          rm -f "$ERR"
          if [ ! -s "$HEADER_FILE" ]; then
            rm -f "$HEADER_FILE"
            echo "::error::learn-pali-origin-secret-$ENV has no value (infra/README.md: origin-secret create $ENV)"
            exit 1
          fi
          # The mask line is the only place the value is printed.
          sed -n 's/^x-origin-auth: /::add-mask::/p' "$HEADER_FILE"

      # 4. The tagged revision, before it has any traffic: the page, the
      #    .wasm, no token shape in it, and the guard (no header, or a wrong
      #    one: 403 with an empty body). A failure leaves the traffic alone.
      - name: Check the revision
        id: check
        if: steps.current.outputs.running != 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          HEADER_FILE="$RUNNER_TEMP/origin-header"
          scripts/rollout-check.sh revision "$URL" "$HEADER_FILE" \
            || { echo "::error::the revision at its tagged URL failed rollout-check.sh; the traffic is untouched"; exit 1; }

      # 5. The traffic, to the revision step 2 created and step 4 checked,
      #    by name: a revision made meanwhile (tofu, a hand deploy) gets none.
      - name: Move the traffic to the revision
        id: traffic
        if: steps.current.outputs.running != 'true'
        env:
          IMAGE_HASH: ${{ steps.vars.outputs.image_hash }}
          REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          set -euo pipefail
          SERVICE="learn-pali-$ENV"
          test -n "$REVISION" || { echo "::error::step 2 named no revision: the traffic is untouched"; exit 1; }
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --to-revisions="$REVISION=100" --quiet
          echo "learn-pali: $SERVICE now serves $IMAGE_HASH (revision $REVISION)"

      # 6a. The bare Cloud Run URL, as anyone who learned it would call it:
      #     it must refuse (403) with no header and with a wrong one. If it
      #     answers, the traffic goes back to PREV and the job fails; when the
      #     rollback itself does not restore PREV the job exits 5.
      - name: Check that the bare origin refuses
        id: refused
        env:
          # The revision that served before this run, and whether this run
          # moved the traffic at all (nothing to undo when the image was
          # already served).
          PREVIOUS: ${{ steps.current.outputs.serving }}
          MOVED: ${{ steps.current.outputs.running != 'true' }}
        run: |
          set -euo pipefail
          SERVICE="learn-pali-$ENV"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format='value(status.url)')
          RC=0
          scripts/rollout-check.sh --refused "$SERVICE_URL" || RC=$?
          if [ "$RC" = 0 ]; then
            echo "learn-pali: $SERVICE_URL refuses a direct call"
            exit 0
          fi
          echo "::error::the bare origin $SERVICE_URL answers a call without the origin header (rollout-check.sh --refused: exit $RC)"
          if [ "$MOVED" != true ] || [ -z "$PREVIOUS" ]; then
            echo "learn-pali: this run moved no traffic, nothing to put back"
            exit 1
          fi
          # The rollback may itself fail; that must not end the step with
          # gcloud's code in place of the check's, so it only reports. Then
          # the traffic is read back: PREV must serve 100%, else exit 5.
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --to-revisions="$PREVIOUS=100" --quiet \
            || echo "::error::rollback to $PREVIOUS failed"
          NOW=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json \
            | jq -r '([.status.traffic[]? | select(.percent == 100)] | first) | .revisionName // empty') || NOW=""
          if [ "$NOW" != "$PREVIOUS" ]; then
            echo "::error::rollback did not restore $PREVIOUS"
            exit 5
          fi
          echo "::error::learn-pali: traffic of $SERVICE moved back to $PREVIOUS"
          exit 1

      # The browser of the host check's hydrate step (rollout-check.sh
      # --via-worker, task 040), its path handed as CHROME.
      - name: Set Chrome up
        id: chrome
        uses: browser-actions/setup-chrome@v2

      # 6b. The public host, every env, through Cloudflare. An env without
      #     Access (ACCESS_<env> false, the workflow env above; dev and prod
      #     today, public behind the origin guard like search-front's): through
      #     the Worker, which adds the header (this script sends none and is
      #     given none): the page, the wasm, no token on the wire, then the
      #     page hydrates in headless Chrome (task 040: no panic, <html
      #     data-hydrated>; Chrome set up by the step before). Exit 1 is a
      #     refusal or a failed content check: a few tries (the new revision
      #     and the edge settle), then the traffic goes back to PREVIOUS and
      #     the job fails. Exit 4 is the Worker itself answering 500 (it lost
      #     its secret) and exit 6 is the edge or the Worker failing (no answer,
      #     a Cloudflare 52x, a 403): the revision is not at fault and a
      #     rollback cures neither, so no rollback, the job fails naming the
      #     remedy. Exit 3 is Cloudflare challenging the runner (curl or
      #     Chrome): a warning, nothing was learned, the check was skipped and
      #     never passed: the orchestrator runs it by hand before any prod tag.
      #     Exit 7 is the host answering the Access login
      #     redirect while ACCESS_<env> is false: the three copies of the fact
      #     (tofu, the workflow, the host) disagree; no rollback, no retry, the job
      #     fails naming ACCESS_<env>. An env WITH Access (ACCESS_<env> true): the
      #     host must redirect to cloudflareaccess.com (--access); 2 and 4 fail
      #     the job named, 3 warns, and none of them rolls back: the revision
      #     was never served to the check. When a rollback does not restore
      #     PREVIOUS the job exits 5.
      - name: Check the public host
        id: host
        env:
          PREVIOUS: ${{ steps.current.outputs.serving }}
          MOVED: ${{ steps.current.outputs.running != 'true' }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          SERVICE="learn-pali-$ENV"
          ACCESS_VAR="ACCESS_$ENV"
          HAS_ACCESS="${!ACCESS_VAR:-}"
          case "$HAS_ACCESS" in
            true | false) ;;
            *)
              echo "::error::$ACCESS_VAR must be true or false in the workflow env (got '$HAS_ACCESS'); it mirrors infra/variables.tf envs.$ENV.access"
              exit 1
              ;;
          esac
          if [ "$HAS_ACCESS" = true ]; then
            RC=0
            scripts/rollout-check.sh --access "https://$HOST" || RC=$?
            if [ "$RC" = 0 ]; then
              echo "learn-pali: https://$HOST redirects to Cloudflare Access"
            elif [ "$RC" = 3 ]; then
              echo "::warning::Cloudflare challenged the runner on https://$HOST/: the Access check did not run"
            elif [ "$RC" = 2 ]; then
              echo "::error::Access is missing on https://$HOST: it answered 200 with no login ($ACCESS_VAR is true; infra: access = true). The revision is not at fault: the traffic stays"
              exit "$RC"
            else
              echo "::error::https://$HOST failed rollout-check.sh --access (exit $RC); the traffic stays"
              exit "$RC"
            fi
            exit 0
          fi
          rollback() {
            if [ "$MOVED" != true ] || [ -z "$PREVIOUS" ]; then
              echo "learn-pali: this run moved no traffic, nothing to put back"
              return 0
            fi
            gcloud run services update-traffic "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --to-revisions="$PREVIOUS=100" --quiet \
              || echo "::error::rollback to $PREVIOUS failed"
            NOW=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format json \
              | jq -r '([.status.traffic[]? | select(.percent == 100)] | first) | .revisionName // empty') || NOW=""
            if [ "$NOW" != "$PREVIOUS" ]; then
              echo "::error::rollback did not restore $PREVIOUS"
              exit 5
            fi
            echo "::error::learn-pali: traffic of $SERVICE moved back to $PREVIOUS"
          }
          RC=1
          for _ in 1 2 3 4 5; do
            RC=0
            scripts/rollout-check.sh --via-worker "https://$HOST" || RC=$?
            [ "$RC" = 1 ] || break
            sleep 3
          done
          if [ "$RC" = 0 ]; then
            echo "learn-pali: https://$HOST answers through the Worker"
          elif [ "$RC" = 3 ]; then
            echo "::warning::Cloudflare challenged the runner on https://$HOST/: a public-host check was skipped, never passed; run scripts/rollout-check.sh --via-worker https://$HOST by hand (CHROME set) before any prod tag"
          elif [ "$RC" = 4 ]; then
            echo "::error::the Worker answered 500 — run infra/scripts/origin-secret push $ENV"
            exit "$RC"
          elif [ "$RC" = 7 ]; then
            echo "::error::https://$HOST/ is behind Cloudflare Access but $ACCESS_VAR is false: set $ACCESS_VAR in deploy.yml (env) to match infra/variables.tf envs.$ENV.access; the revision is not at fault, no rollback"
            exit "$RC"
          elif [ "$RC" = 6 ]; then
            echo "::error::the edge or the Worker failed on https://$HOST/ (rollout-check.sh --via-worker exit 6: no answer, a Cloudflare 52x, or a 403 from a wrong Worker secret); the revision is not at fault, no rollback. Check the Worker route, then infra/scripts/origin-secret push $ENV"
            exit "$RC"
          else
            echo "https://$HOST/ failed rollout-check.sh --via-worker (exit $RC: the service refused it, or a content check failed)"
            # A refusal or a failed content check (exit 1, after the retries):
            # put the traffic back, and fail the job.
            if [ "$RC" = 1 ]; then rollback; fi
            exit "$RC"
          fi

      - name: Remove the origin header file
        if: always()
        run: rm -f "$RUNNER_TEMP/origin-header" "$RUNNER_TEMP/origin-header.err"
